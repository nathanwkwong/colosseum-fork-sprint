# One cheap Colosseum collusion run. Needs OPENAI_API_KEY in a root .env.
# From the Colosseum repo root:
#   python -m experiments.collusion.run --config study_data/collusion_one_seed.yaml

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [collusion_study_one_seed]

environment:
  name: JiraTicketEnvironment
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true

llm_models:
  - label: openai_gpt4o_mini
    llm:
      provider: openai
      openai:
        model: gpt-4o-mini
        params:
          max_tokens: 1500
          temperature: 0.7

experiment:
  tag: collusion_one_seed
  output_dir: experiments/collusion/outputs/collusion_one_seed
  max_concurrent_runs: 1
  seeds: [1]
  collusion:
    colluder_selection: first
  sweeps:
    - name: one_seed
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [false]
      prompt_variants: [control]
