# Local Colosseum collusion run via Ollama (OpenAI is geo-blocked here).
# Start Ollama first, then from the Colosseum repo root:
#   python -m experiments.collusion.run --config study_data/collusion_one_seed_ollama.yaml

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [collusion_study_one_seed_ollama]

environment:
  name: JiraTicketEnvironment
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true

llm_models:
  - label: ollama_llama32_3b
    llm:
      provider: together
      together:
        model: llama3.2:3b
        base_url: http://127.0.0.1:11434/v1
        api_key: ollama
        request_timeout: 180
        params:
          max_tokens: 1024
          temperature: 0.7

experiment:
  tag: collusion_one_seed_ollama
  output_dir: experiments/collusion/outputs/collusion_one_seed_ollama
  max_concurrent_runs: 1
  seeds: [1]
  collusion:
    colluder_selection: first
  sweeps:
    - name: one_seed
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [false]
      prompt_variants: [control]
